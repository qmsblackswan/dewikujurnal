<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dewiku Akademia</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#12264A;--onp:#fff;--gold:#E0A526;--bg:#EEF3FB;--card:#fff;--tint:#E1EAFF;--ink:#1B2438;--mute:#5B667A;--line:#DCE1EB;--ok:#1F8A5B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pri:#E0A526;--onp:#12264A;--bg:#0D1526;--card:#15203A;--tint:#1F2F5E;--ink:#E7EBF4;--mute:#9AA6BD;--line:#26334F;--ok:#4CC38A;color-scheme:dark}}
:root[data-theme="dark"]{--pri:#E0A526;--onp:#12264A;--bg:#0D1526;--card:#15203A;--tint:#1F2F5E;--ink:#E7EBF4;--mute:#9AA6BD;--line:#26334F;--ok:#4CC38A;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.6 'Plus Jakarta Sans',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(30px,5vw,46px)}h2{font-size:clamp(24px,3.5vw,32px)}h3{font-size:19px}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:3px solid;border-image:linear-gradient(90deg,#1D4ED8,#7C3AED,#F97316) 1;z-index:9}
.hd{display:flex;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px}
.logo{font:700 20px Fraunces,Georgia,serif;white-space:nowrap;cursor:pointer}
.nav{display:flex;gap:4px;align-items:center;overflow-x:auto;white-space:nowrap;margin-left:auto}
.lk{background:none;border:0;color:var(--ink);font:inherit;font-size:14px;padding:8px 10px;cursor:pointer;border-radius:8px;transition:transform .2s,color .2s,background .2s}.lk:hover{transform:translateY(-2px);color:#fff;background:linear-gradient(135deg,#1D4ED8,#6D28D9)}.lk:active{transform:scale(.9)}
section{padding:56px 0}
.card{background:linear-gradient(145deg,var(--card),var(--tint));border:1px solid var(--line);border-radius:14px;padding:20px;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(30,50,120,.15)}
.gc,.ff,.fb{color:#fff;background:linear-gradient(135deg,var(--a),var(--b));border:0;border-radius:14px;padding:20px;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}.fb{background:linear-gradient(135deg,var(--b),var(--a))}
.gc,.flip{--a:#1D4ED8;--b:#4338CA}.gc:nth-child(5n+2),.flip:nth-child(5n+2){--a:#0E7490;--b:#047857}.gc:nth-child(5n+3),.flip:nth-child(5n+3){--a:#7C3AED;--b:#BE185D}.gc:nth-child(5n+4),.flip:nth-child(5n+4){--a:#C2410C;--b:#9F1239}.gc:nth-child(5n+5),.flip:nth-child(5n+5){--a:#047857;--b:#1D4ED8}
.gc .mu,.ff .mu,.fb .mu{color:rgba(255,255,255,.85)}.gc:hover{box-shadow:0 16px 32px rgba(20,30,90,.3)}.gc:nth-child(3n+1):hover{transform:translateY(-8px) rotate(-1.2deg)}.gc:nth-child(3n+2):hover{transform:translateY(-8px) rotate(1.2deg)}.gc:nth-child(3n):hover{transform:translateY(-4px) scale(1.04)}
.flip{perspective:900px;height:240px;--d:0,1,0;cursor:pointer}.flip:nth-child(even){--d:1,0,0}.fi{position:relative;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}.flip:hover .fi,.flip:focus-within .fi,.flip.on .fi{transform:rotate3d(var(--d),180deg)}.ff,.fb{position:absolute;inset:0;box-sizing:border-box;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:auto;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}.fb{transform:rotate3d(var(--d),180deg)}
.cap{width:100%;height:auto;cursor:pointer;overflow:visible}.cap *{transform-box:fill-box}.cap .cb{transform-origin:center}.cap .ts{transform-origin:50% 0}.cap .dp,.cap .st,.cap .rg{transform-origin:center}
@media(prefers-reduced-motion:no-preference){.cap{animation:flt 5s ease-in-out infinite}.cap .ts{animation:swg 2.4s ease-in-out infinite}.cap .dp{animation:rck 3.6s ease-in-out infinite}.cap .st{animation:twk 2.2s ease-in-out infinite}.cap .rg{animation:spn 40s linear infinite}.cap:hover .cb,.cap.t .cb{animation:toss 1.3s cubic-bezier(.3,.7,.4,1)}}
@keyframes flt{50%{transform:translateY(-10px)}}@keyframes swg{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}@keyframes rck{50%{transform:rotate(-4deg) translateY(-4px)}}@keyframes twk{0%,100%{opacity:.4;transform:scale(.7)}50%{opacity:1;transform:scale(1.3)}}@keyframes spn{to{transform:rotate(360deg)}}@keyframes toss{0%{transform:none}35%{transform:translateY(-70px) rotate(-14deg)}65%{transform:translateY(-16px) rotate(6deg)}100%{transform:none}}
@keyframes pgin{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}.pg{animation:pgin .5s cubic-bezier(.2,.8,.2,1)}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rpl .6s ease-out forwards;pointer-events:none}@keyframes rpl{to{transform:scale(4);opacity:0}}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.btn{position:relative;overflow:hidden;display:inline-block;text-decoration:none;text-align:center;background:linear-gradient(135deg,#1D4ED8,#6D28D9);color:#fff;border:1px solid transparent;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,filter .25s}.btn:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 8px 18px rgba(67,56,202,.4);filter:saturate(1.25)}.btn:active{transform:scale(.93)}
.btn.g{background:linear-gradient(135deg,#FBBF24,#F97316);color:#1B1200}.btn.o{background:transparent;color:var(--ink);border-color:var(--line)}.btn.o:hover{background:linear-gradient(135deg,#1D4ED8,#6D28D9);color:#fff;border-color:transparent}.btn.s{padding:5px 12px;font-size:13px}.btn{line-height:1.25;box-sizing:border-box;vertical-align:middle}.cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.cta .btn{min-height:46px;display:inline-flex;align-items:center;justify-content:center}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 12px}
label{font-size:14px;font-weight:500;display:block}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{background:linear-gradient(120deg,#0B1F4D,#1D4ED8 55%,#6D28D9);color:#fff;padding:48px 0}
.hero .wrap{display:grid;gap:32px;grid-template-columns:1.1fr .9fr;align-items:center}
.hero p{color:#C9D3E8;max-width:52ch}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;border:1px solid #3A5588;color:#fff;font-size:14px;margin:0 6px 6px 0}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr}}
.mu{color:var(--mute)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}tr:hover td{background:var(--tint)}
.bar{height:10px;background:linear-gradient(90deg,#1D4ED8,#7C3AED,#F97316);border-radius:5px;transition:width .6s}.trk{background:var(--line);border-radius:5px;height:10px}
.promo{background:linear-gradient(120deg,#FBBF24,#F97316);color:#12264A;border-radius:16px;padding:28px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.promo h2{margin:0}.promo .btn{background:#12264A;color:#fff}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none}
.ph{display:grid;place-items:center;font:700 28px Fraunces,Georgia,serif;color:var(--onp);background:var(--pri)}
.wc{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.wc p{margin:2px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.big{font:700 26px Fraunces,Georgia,serif}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--pri);color:var(--onp);padding:10px 18px;border-radius:10px;z-index:20;max-width:90%}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--mute);font-size:14px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;flex:none}
.lg{width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(20,30,90,.3);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.brand:hover .lg{transform:rotate(360deg) scale(1.08)}.brand:active .lg{transform:scale(.9)}
.bt{font:700 21px/1 Fraunces,Georgia,serif;display:flex;flex-direction:column}.bt small{font:500 12px 'Plus Jakarta Sans',sans-serif;color:var(--mute);margin-top:4px}
.hb{display:none;margin-left:auto;border:1px solid var(--line)}
.pl{display:grid;grid-template-columns:minmax(250px,340px) 1fr;gap:20px;align-items:start}
.pl canvas{width:100%;height:auto;border-radius:12px;box-shadow:0 10px 30px rgba(20,30,90,.25)}
.pal{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.sw{width:20px;height:20px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:6px}
@media(max-width:900px){.hb{display:block}.nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;overflow:visible;background:var(--card);padding:10px 20px 16px;border-bottom:3px solid #7C3AED;margin-left:0}.nav.open{display:flex}.nav .lk{text-align:left;padding:12px 10px}.pl{grid-template-columns:1fr}}
